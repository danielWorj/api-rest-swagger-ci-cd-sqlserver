openapi: 3.0.3
info:
  title: API Gestion des Comptes Bancaires
  description: |
    API REST de gestion des clients, comptes bancaires et transactions.
  version: 1.0.0
  contact:
    name: Équipe Banque
    email: dev@banque.example
servers:
  - url: http://localhost:8080
    description: Local / Docker
tags:
  - name: Clients
    description: Gestion des clients
  - name: Comptes
    description: Gestion des comptes bancaires
  - name: Transactions
    description: Dépôts, retraits, virements et historique

paths:
  /api/v1/clients:
    get:
      tags: [Clients]
      summary: Lister les clients (paginé)
      operationId: listerClients
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: Liste paginée des clients
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageClient'
    post:
      tags: [Clients]
      summary: Créer un client
      operationId: creerClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRequest'
      responses:
        '201':
          description: Client créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/clients/{id}:
    parameters:
      - $ref: '#/components/parameters/idPath'
    get:
      tags: [Clients]
      summary: Récupérer un client
      operationId: getClient
      responses:
        '200':
          description: Client trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Clients]
      summary: Modifier un client
      operationId: modifierClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRequest'
      responses:
        '200':
          description: Client modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Clients]
      summary: Supprimer un client (sans compte actif)
      operationId: supprimerClient
      responses:
        '204':
          description: Client supprimé
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/clients/{id}/comptes:
    parameters:
      - $ref: '#/components/parameters/idPath'
    get:
      tags: [Clients, Comptes]
      summary: Lister les comptes d'un client
      operationId: comptesDuClient
      responses:
        '200':
          description: Comptes du client
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompteResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/comptes:
    post:
      tags: [Comptes]
      summary: Ouvrir un compte
      operationId: ouvrirCompte
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompteRequest'
      responses:
        '201':
          description: Compte ouvert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/comptes/{numero}:
    parameters:
      - $ref: '#/components/parameters/numeroPath'
    get:
      tags: [Comptes]
      summary: Consulter un compte par son numéro
      operationId: getCompte
      responses:
        '200':
          description: Compte trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompteResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/comptes/{numero}/statut:
    patch:
      tags: [Comptes]
      summary: Changer le statut d'un compte (bloquer, clôturer...)
      operationId: changerStatut
      parameters:
        - $ref: '#/components/parameters/numeroPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [statut]
              properties:
                statut:
                  $ref: '#/components/schemas/StatutCompte'
      responses:
        '200':
          description: Statut mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompteResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/comptes/{numero}/depot:
    post:
      tags: [Transactions]
      summary: Effectuer un dépôt
      operationId: depot
      parameters:
        - $ref: '#/components/parameters/numeroPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationRequest'
      responses:
        '200':
          description: Dépôt effectué
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/comptes/{numero}/retrait:
    post:
      tags: [Transactions]
      summary: Effectuer un retrait
      operationId: retrait
      parameters:
        - $ref: '#/components/parameters/numeroPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationRequest'
      responses:
        '200':
          description: Retrait effectué
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Solde insuffisant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/virements:
    post:
      tags: [Transactions]
      summary: Effectuer un virement entre deux comptes
      operationId: virement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VirementRequest'
      responses:
        '200':
          description: Virement effectué
          content:
            application/json:
              schema:
                type: array
                description: Les deux écritures (débit puis crédit)
                items:
                  $ref: '#/components/schemas/TransactionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Solde insuffisant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/comptes/{numero}/transactions:
    get:
      tags: [Transactions]
      summary: Historique des transactions d'un compte (paginé)
      operationId: historique
      parameters:
        - $ref: '#/components/parameters/numeroPath'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/TypeTransaction'
        - name: dateDebut
          in: query
          schema:
            type: string
            format: date
        - name: dateFin
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Historique paginé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageTransaction'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    idPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    numeroPath:
      name: numero
      in: path
      required: true
      description: Numéro de compte (ex. CM2100012345678901)
      schema:
        type: string
    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    StatutCompte:
      type: string
      enum: [ACTIF, BLOQUE, CLOTURE]

    TypeCompte:
      type: string
      enum: [COURANT, EPARGNE]

    TypeTransaction:
      type: string
      enum: [DEPOT, RETRAIT, VIREMENT_DEBIT, VIREMENT_CREDIT]

    ClientRequest:
      type: object
      required: [nom, prenom, email]
      properties:
        nom:
          type: string
          maxLength: 100
          example: Ngono
        prenom:
          type: string
          maxLength: 100
          example: Marie
        email:
          type: string
          format: email
          example: marie.ngono@example.com
        telephone:
          type: string
          example: "+237677000000"
        dateNaissance:
          type: string
          format: date
          example: "1992-04-15"
        adresse:
          type: string
          example: Akwa, Douala

    ClientResponse:
      allOf:
        - $ref: '#/components/schemas/ClientRequest'
        - type: object
          properties:
            id:
              type: integer
              format: int64
            dateCreation:
              type: string
              format: date-time

    PageClient:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ClientResponse'
        number: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

    CompteRequest:
      type: object
      required: [clientId, type]
      properties:
        clientId:
          type: integer
          format: int64
        type:
          $ref: '#/components/schemas/TypeCompte'
        depotInitial:
          type: number
          format: double
          minimum: 0
          default: 0
        decouvertAutorise:
          type: number
          format: double
          minimum: 0
          default: 0

    CompteResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        numero:
          type: string
          example: CM2100012345678901
        type:
          $ref: '#/components/schemas/TypeCompte'
        statut:
          $ref: '#/components/schemas/StatutCompte'
        solde:
          type: number
          format: double
        devise:
          type: string
          example: XAF
        decouvertAutorise:
          type: number
          format: double
        clientId:
          type: integer
          format: int64
        dateOuverture:
          type: string
          format: date-time

    OperationRequest:
      type: object
      required: [montant]
      properties:
        montant:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          example: 50000
        libelle:
          type: string
          example: Dépôt guichet

    VirementRequest:
      type: object
      required: [compteSource, compteDestination, montant]
      properties:
        compteSource:
          type: string
        compteDestination:
          type: string
        montant:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
        libelle:
          type: string

    TransactionResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        reference:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TypeTransaction'
        montant:
          type: number
          format: double
        soldeApres:
          type: number
          format: double
        libelle:
          type: string
        numeroCompte:
          type: string
        dateTransaction:
          type: string
          format: date-time

    PageTransaction:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TransactionResponse'
        number: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 404
        error:
          type: string
          example: Not Found
        message:
          type: string
          example: Compte introuvable
        path:
          type: string
        details:
          type: array
          items:
            type: string

  responses:
    BadRequest:
      description: Requête invalide (validation)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflit métier (doublon, état incompatible...)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'